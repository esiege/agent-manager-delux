<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Get started: paste one prompt, copy one sentence, send it to your agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2433"/><stop offset="1" stop-color="#0f1520"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#339af0"/><stop offset="1" stop-color="#5c7cfa"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b7a90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf6}
      .n{font-size:15px;font-weight:700;fill:#fff}
      .t{font-size:24px;font-weight:700}
      .s{font-size:15px;fill:#9fb0c6}
      .m{font-family:'Cascadia Code',Consolas,Menlo,monospace;font-size:13px;fill:#8fd0ff}
    </style>
  </defs>
  <rect width="960" height="300" rx="20" fill="url(#bg)"/>

  <!-- step 1 -->
  <g transform="translate(30,30)">
    <rect width="270" height="240" rx="16" fill="#18202e" stroke="#2b3850"/>
    <circle cx="36" cy="38" r="16" fill="url(#accent)"/><text class="n" x="36" y="43.5" text-anchor="middle">1</text>
    <text class="t" x="64" y="46">Paste</text>
    <!-- terminal -->
    <rect x="24" y="82" width="222" height="84" rx="10" fill="#0b1019" stroke="#2b3850"/>
    <circle cx="40" cy="97" r="4" fill="#ff6b6b"/><circle cx="54" cy="97" r="4" fill="#fcc419"/><circle cx="68" cy="97" r="4" fill="#51cf66"/>
    <text class="m" x="38" y="130">&gt; Read deploy.md and</text>
    <text class="m" x="38" y="150">  set it up for me…</text>
    <text class="s" x="24" y="200">One prompt, in Claude Code.</text>
    <text class="s" x="24" y="220">About 10 minutes.</text>
  </g>

  <path d="M308 150H338" stroke="#6b7a90" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <g transform="translate(345,30)">
    <rect width="270" height="240" rx="16" fill="#18202e" stroke="#2b3850"/>
    <circle cx="36" cy="38" r="16" fill="url(#accent)"/><text class="n" x="36" y="43.5" text-anchor="middle">2</text>
    <text class="t" x="64" y="46">Copy</text>
    <!-- sentence card -->
    <rect x="24" y="82" width="222" height="84" rx="10" fill="#0b1019" stroke="#2b3850"/>
    <rect x="38" y="98" width="130" height="10" rx="5" fill="#3a4a66"/>
    <rect x="38" y="118" width="170" height="10" rx="5" fill="#339af0" opacity=".85"/>
    <rect x="38" y="138" width="90" height="10" rx="5" fill="#3a4a66"/>
    <rect x="178" y="136" width="54" height="20" rx="10" fill="url(#accent)"/><text x="205" y="150" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#fff">Copy</text>
    <text class="s" x="24" y="200">One sentence, from the</text>
    <text class="s" x="24" y="220">Instructions tab.</text>
  </g>

  <path d="M623 150H653" stroke="#6b7a90" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <g transform="translate(660,30)">
    <rect width="270" height="240" rx="16" fill="#18202e" stroke="#2b3850"/>
    <circle cx="36" cy="38" r="16" fill="url(#accent)"/><text class="n" x="36" y="43.5" text-anchor="middle">3</text>
    <text class="t" x="64" y="46">Send</text>
    <!-- dashboard rows -->
    <rect x="24" y="82" width="222" height="84" rx="10" fill="#0b1019" stroke="#2b3850"/>
    <circle cx="42" cy="104" r="5" fill="#51cf66"/><rect x="56" y="99" width="100" height="10" rx="5" fill="#3a4a66"/><text x="232" y="108" text-anchor="end" style="font-size:11px;fill:#51cf66">working</text>
    <circle cx="42" cy="127" r="5" fill="#fcc419"/><rect x="56" y="122" width="84" height="10" rx="5" fill="#3a4a66"/><text x="232" y="131" text-anchor="end" style="font-size:11px;fill:#fcc419">waiting</text>
    <circle cx="42" cy="150" r="5" fill="#74c0fc"/><rect x="56" y="145" width="110" height="10" rx="5" fill="#3a4a66"/><text x="232" y="154" text-anchor="end" style="font-size:11px;fill:#74c0fc">done</text>
    <text class="s" x="24" y="200">To your agent. Done.</text>
    <text class="s" x="24" y="220">It shows up on Agents.</text>
  </g>
</svg>
